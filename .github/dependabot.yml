version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Rome
    versioning-strategy: increase-if-necessary
    groups:
      frontend:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
