name: HugoBlox preview

on:
  push:
    branches:
      - codex/hugo-wowchemy-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: hugoblox-migration/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm and frontend dependencies
        working-directory: hugoblox-migration
        run: |
          npm install --global pnpm@10.14.0
          pnpm install --frozen-lockfile

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Validate content
        run: ruby hugoblox-migration/scripts/check-content.rb

      - name: Build HugoBlox
        run: hugo --source hugoblox-migration --destination public --gc --minify

      - name: Build search index
        run: npx --yes pagefind@1.5.2 --site hugoblox-migration/public

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugoblox-preview
          path: hugoblox-migration/public
          if-no-files-found: error
          retention-days: 14
