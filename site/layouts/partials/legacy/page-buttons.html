{{ $page := . }}
{{ with $page.Params.links }}
  <div class="resource-actions" data-pagefind-ignore>
    {{ range . }}<a href="{{ .url }}" target="_blank" rel="noopener">{{ partial "legacy/event-resource-label.html" . }}</a>{{ end }}
    {{ with $page.Params.identifiers }}{{ with .doi }}<a href="https://doi.org/{{ . }}" target="_blank" rel="noopener">DOI</a>{{ end }}{{ end }}
  </div>
{{ end }}
