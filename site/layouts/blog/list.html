{{ define "main" }}
{{ $pages := where site.RegularPages "Section" "blog" }}
{{ $pages = where $pages "Params.course_hidden" "ne" true }}
<main class="legacy-archive legacy-blog-archive">
  <h1>Teaching</h1>
  <div class="teaching-list">
    {{ range sort $pages "Title" }}
      {{ partial "legacy/course-row.html" (dict "page" . "archive" true) }}
    {{ end }}
  </div>
</main>
{{ end }}
