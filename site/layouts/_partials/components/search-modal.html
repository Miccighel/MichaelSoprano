<div
  id="site-search"
  class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm"
  data-pagefind-url="{{ "pagefind/pagefind.js" | relURL }}"
  hidden
>
  <div class="absolute inset-0" data-search-close aria-hidden="true"></div>

  <section
    class="relative mx-auto mt-[10vh] max-w-3xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="site-search-title"
  >
    <div class="mx-4 overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-gray-900/10 dark:bg-gray-900 dark:ring-white/10">
      <h2 id="site-search-title" class="sr-only">Search this website</h2>

      <div class="border-b border-gray-200 dark:border-gray-800">
        <div class="flex items-center gap-3 px-4 py-3">
          <svg class="h-5 w-5 flex-shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>

          <input
            id="site-search-input"
            type="search"
            placeholder="Search for answers..."
            class="flex-1 bg-transparent text-lg text-gray-900 outline-none placeholder-gray-400 dark:text-gray-100"
            aria-label="Search this website"
            aria-controls="site-search-results"
            aria-autocomplete="list"
            autocomplete="off"
          >

          <svg data-search-loading class="hidden h-5 w-5 flex-shrink-0 animate-spin text-primary-600" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>

          <kbd class="hidden flex-shrink-0 rounded bg-gray-100 px-2 py-1 text-xs font-semibold text-gray-600 dark:bg-gray-800 dark:text-gray-400 sm:block">ESC</kbd>

          <button
            type="button"
            class="flex-shrink-0 cursor-pointer rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-gray-800 dark:hover:text-gray-300"
            data-search-close
            aria-label="Close search"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="max-h-[60vh] overflow-y-auto">
        <template id="site-search-result-template">
          <a class="site-search-result group block border-l-2 border-transparent px-6 py-4 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800" role="option" aria-selected="false">
            <h3 class="mb-2 text-lg font-semibold text-gray-900 transition-colors group-hover:text-primary-600 dark:text-white dark:group-hover:text-primary-400"></h3>
            <p class="line-clamp-2 text-sm text-gray-600 dark:text-gray-400"></p>
          </a>
        </template>

        <div data-search-intro class="p-6" aria-hidden="true"></div>
        <div id="site-search-results" class="divide-y divide-gray-200 dark:divide-gray-800" role="listbox" aria-label="Search results"></div>

        <div data-search-empty class="hidden px-6 py-12 text-center">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">No results found</h3>
          <p class="mt-2 text-gray-600 dark:text-gray-400">Try a different search term.</p>
        </div>

        <div data-search-error class="hidden px-6 py-12 text-center" role="alert">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Search is temporarily unavailable</h3>
          <p class="mt-2 text-gray-600 dark:text-gray-400">Please close the search and try again.</p>
        </div>
      </div>

      <div class="border-t border-gray-200 bg-gray-50 px-4 py-3 dark:border-gray-800 dark:bg-gray-900/50">
        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
          <div class="flex items-center gap-3">
            <span class="flex items-center gap-1">
              <kbd class="rounded border border-gray-300 bg-white px-1.5 py-0.5 font-mono text-[10px] font-semibold dark:border-gray-700 dark:bg-gray-800">↑↓</kbd>
              Navigate
            </span>
            <span class="flex items-center gap-1">
              <kbd class="rounded border border-gray-300 bg-white px-1.5 py-0.5 font-mono text-[10px] font-semibold dark:border-gray-700 dark:bg-gray-800">↵</kbd>
              Select
            </span>
          </div>
          <a href="https://pagefind.app/" target="_blank" rel="noopener" class="flex items-center gap-1 transition-colors hover:text-primary-600 dark:hover:text-primary-400">
            <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            Search by Pagefind
          </a>
        </div>
      </div>
    </div>
  </section>

  <p class="sr-only" aria-live="polite" data-search-status></p>
</div>

<style>
  .site-search-result.is-selected {
    border-left-color: var(--color-primary-600, #2563eb);
    background: color-mix(in srgb, var(--color-primary-600, #2563eb) 8%, transparent);
  }

  .site-search-result mark {
    background: transparent;
    color: inherit;
    font-weight: 700;
  }
</style>
