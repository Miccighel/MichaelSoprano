<div
  id="site-search"
  class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm"
  data-pagefind-url="{{ "pagefind/pagefind.js" | relURL }}"
  hidden
>
  <div class="absolute inset-0" data-search-close aria-hidden="true"></div>

  <section
    class="site-search-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="site-search-title"
  >
    <div class="site-search-shell">
      <h2 id="site-search-title" class="sr-only">Search this website</h2>

      <div class="site-search-bar">
        <div class="site-search-bar-inner">
          <svg class="h-5 w-5 flex-shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>

          <input
            id="site-search-input"
            type="search"
            placeholder="Search publications, talks, courses..."
            class="site-search-input"
            aria-label="Search this website"
            aria-controls="site-search-results"
            aria-autocomplete="list"
            autocomplete="off"
          >

          <svg data-search-loading class="hidden h-5 w-5 flex-shrink-0 animate-spin text-primary-600" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>

          <kbd class="site-search-escape">ESC</kbd>

          <button
            type="button"
            class="site-search-close"
            data-search-close
            aria-label="Close search"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="site-search-results-wrap">
        <template id="site-search-result-template">
          <a class="site-search-result" role="option" aria-selected="false">
            <h3></h3>
            <p></p>
          </a>
        </template>

        <div data-search-intro class="site-search-intro" aria-hidden="true"><p>Search publications, presentations, teaching and topics.</p></div>
        <div id="site-search-results" role="listbox" aria-label="Search results"></div>

        <div data-search-empty class="site-search-message hidden">
          <h3>No results found</h3>
          <p>Try a different search term.</p>
        </div>

        <div data-search-error class="site-search-message hidden" role="alert">
          <h3>Search is temporarily unavailable</h3>
          <p>Please close the search and try again.</p>
        </div>
      </div>

      <div class="site-search-footer">
        <div><kbd>↑↓</kbd> Navigate <kbd>↵</kbd> Open</div>
        <div><kbd>ESC</kbd> Close <span class="site-search-powered">Search by Pagefind</span></div>
      </div>
    </div>
  </section>

  <p class="sr-only" aria-live="polite" data-search-status></p>
</div>

<style>
  .site-search-result.is-selected {
    border-left-color: var(--site-primary);
    background: var(--site-primary-soft);
  }

  .site-search-result mark {
    background: transparent;
    color: var(--site-primary-hover);
    font-weight: 700;
  }
</style>
